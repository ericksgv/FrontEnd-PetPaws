<ng-container *ngIf="rol === 'VETERINARIO'; else adminTopBar">
    <app-top-bar-veterinario></app-top-bar-veterinario>
</ng-container>
<ng-template #adminTopBar>
    <app-top-bar-admin></app-top-bar-admin>
</ng-template>
<div class="completo">
    <div class="wave-container"></div>
    <img class="waveimage" src="./assets/crearusuario/iconoimagen.svg" alt="perro">
    <a [routerLink]="'/usuario/all'">
        <img class="waveimage2" src="./assets/crearmascota/devolverse.svg" alt="devolverse">
    </a>
    <section class="container-wave2 creacional">
        <h1 class="title-creacional subrayado">Añadir Usuario</h1>
        <form [formGroup]="usuarioForm" (ngSubmit)="agregarUsuario()">
            <div class="columna orientation">
                <div class="uno">
                    <label for="cedula" class="acento-verde-texto enunciado">Cedula*</label>
                    <br>
                    <input type="number" formControlName="cedula" class="lacento-verde-texto labelenunciado" id="cedula"
                        placeholder="Cedula">
                </div>
                <div class="dos">
                    <label for="nombre" class="acento-verde-texto enunciado">Nombre*</label>
                    <br>
                    <input type="text" formControlName="nombre" class="acento-verde-texto labelenunciado" id="nombre"
                        placeholder="Nombre">
                </div>
            </div>
            <div class="columna">
                <div class="uno">
                    <label for="correo" class="acento-verde-texto enunciado">Correo*</label>

                    <br>
                    <input type="text" formControlName="correo" class="lacento-verde-texto labelenunciado" id="correo"
                        placeholder="Correo">

                </div>
                <div class="dos">
                    <label for="celular" class="acento-verde-texto enunciado">Celular*</label>
                    <br>
                    <input type="number" formControlName="celular" class="lacento-verde-texto labelenunciado"
                        id="celular" placeholder="Celular">
                </div>
            </div>
            <input type="hidden" formControlName="id" name="id" />

            <div id="mensajeError" *ngIf="showError" class="error-message">
                Por favor, complete todos los campos requeridos y asegúrese de que el formato del correo sea válido.
            </div>

            <button id="btnAgregarCliente" type="submit"
                class="creacional2 boton-redondo acento-amarillo-fondo texto-negrilla">
                Agregar Usuario
            </button>
        </form>
    </section>
</div>
