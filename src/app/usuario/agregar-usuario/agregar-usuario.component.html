<div class="completo">
<app-header [titleColor]="'amarillo-principal-acento'" [backgroundColor]="'acento-transparente'"></app-header>
<section class="container-wave2 creacional">
    <h1 class="title-creacional subrayado margin-bottom">Añadir Usuario</h1>
    <form [formGroup]="usuarioForm" (ngSubmit)="agregarUsuario()">
        <div class="columna">
            <div class="uno">
                <label for="cedula" class="acento-verde-texto enunciado">Cedula*</label>
                <br>
                <input type="number" formControlName="cedula" class="lacento-verde-texto labelenunciado" id="cedula" placeholder="cedula">
            </div>
            <div class="dos">
                <label for="nombre" class="acento-verde-texto enunciado">Nombre*</label>
                <br>
                <input type="text" formControlName="nombre" class="acento-verde-texto labelenunciado" id="nombre" placeholder="nombre usuario">
            </div>
        </div>
        <div class="columna">
            <div class="uno">
                <label for="correo" class="acento-verde-texto enunciado">Correo*</label>
                <br>
                <input type="text" formControlName="correo" class="lacento-verde-texto labelenunciado" id="correo" placeholder="correo">
            </div>
            <div class="dos">
                <label for="celular" class="acento-verde-texto enunciado">Celular*</label>
                <br>
                <input type="number" formControlName="celular" class="lacento-verde-texto labelenunciado" id="celular" placeholder="celular">
            </div>
        </div>
        <input type="hidden" formControlName="id" name="id" />
        <button type="submit" class="creacional2 no-bordes boton-redondo acento-amarillo-fondo letra-poppins textoBlanco texto-negrilla">
            Agregar Usuario
        </button>
    </form>
</section>
<div class="wave-container"></div>
<img class="waveimage" src="./assets/crearusuario/iconoimagen.svg" alt="perro">
<img class="waveimage2" src="./assets/crearmascota/devolverse.svg" alt="devolverse">
</div>
