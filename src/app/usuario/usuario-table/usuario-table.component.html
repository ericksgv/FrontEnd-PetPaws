<!-- app-usuario-table.component.html -->

<app-top-bar-cliente></app-top-bar-cliente>
<div class="acento-amarillo-semi-claro-fondo contenedor-pagina">
  <div class="cuadro-estatico acento-verde-semi-claro-fondo">
    <div class="rectangulo"></div>
    <h1 class="titulo-recoleta">Lista de Usuarios</h1>
    <div class="grupo-elementos">
      <label for="campoBusqueda" class="busqueda">
        <input type="text" id="campoBusqueda" name="campoBusqueda" placeholder="Busca por cédula"
          [(ngModel)]="textoBusqueda" (input)="filtrarUsuarios()">
      </label>
      <div class="boton-derecha">
        <label for="campoBusqueda" class="busqueda">
          <input type="text" [(ngModel)]="busquedaAvanzada" placeholder="Búsqueda Avanzada">
        </label>
      </div>
    </div>

    <div class="tres-botones texto-negrilla textoNegro">
      <button [ngClass]="filtroActivoNombre ? 'filtro-activo' : 'acentro-amarillo-fondo texto-negrilla  .filtro-btn'"
        class="acentro-amarillo-fondo texto-negrilla  .filtro-btn"
        (click)="filtrarPorAtributo('nombre')">Nombre</button>
      <button [ngClass]="filtroActivoCorreo ? 'filtro-activo' : 'acentro-amarillo-fondo texto-negrilla  .filtro-btn'"
        class="acentro-amarillo-fondo texto-negrilla  .filtro-btn"
        (click)="filtrarPorAtributo('correo')">Correo</button>
      <button [ngClass]="filtroActivoCelular ? 'filtro-activo' : 'acentro-amarillo-fondo texto-negrilla  .filtro-btn'"
        class="acentro-amarillo-fondo texto-negrilla  .filtro-btn"
        (click)="filtrarPorAtributo('celular')">Celular</button>
      <button [ngClass]="filtroActivoEstado ? 'filtro-activo' : 'acentro-amarillo-fondo texto-negrilla  .filtro-btn'"
        class="acentro-amarillo-fondo texto-negrilla  .filtro-btn"
        (click)="filtrarPorAtributo('estado')">Estado</button>
      <button class="acentro-amarillo-fondo texto-negrilla  .filtro-btn" (click)="filtrarPorAtributo('limpiar')">Limpiar
        búsqueda avanzada</button>
    </div>
    <div class="tres-botones texto-negrilla textoNegro">
      <div class="margenizquierdo"></div>
      <div class="boton-contenedor">
        <div class="mitad-izquierda acentro-amarillo-fondo">
          <!-- Lista desplegable izquierda -->
          <select class="acentro-amarillo-fondo no-border texto-negrilla" [(ngModel)]="selectedSortBy"
            (ngModelChange)="ordenarUsuarios()">
            <option value="cedula">Cédula</option>
            <option value="nombre">Nombre</option>
            <option value="correo">Correo</option>
            <option value="celular">Celular</option>
            <option value="estado">Estado</option>
          </select>
        </div>
        <div class="mitad-derecha">
          <!-- Lista desplegable derecha -->
          <select class="acento-amarillo-claro-fondo texto-negrilla no-border" [(ngModel)]="selectedSortOrder"
            (ngModelChange)="ordenarUsuarios()">
            <option value="asc">Ascendente</option>
            <option value="desc">Descendente</option>
          </select>
        </div>
      </div>
      <div class="margenizquierdo"></div>

      <div class="boton-contenedor">
        <div class="mitad-izquierda acentro-amarillo-fondo">
          <!-- Lista desplegable para seleccionar la cantidad de mascotas por página -->
          <select class="acentro-amarillo-fondo texto-negrilla no-border" [(ngModel)]="itemsPorPagina"
            (ngModelChange)="cambiarCantidadPorPagina()">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
      </div>

    </div>
  </div>

  <section class="cuadro-estatico2">
    <table class="tabla-general2">
      <thead>
        <tr class="texto-negrilla textoNegro letra-normal-grande encabezados-tabla acento-verde-semi-claro-fondo">
          <th scope="col"></th>
          <th scope="col">Cédula</th>
          <th scope="col">Nombre</th>
          <th scope="col">Correo</th>
          <th scope="col">Celular</th>
          <th scope="col">Estado</th>
          <th scope="col"></th>
          <th scope="col"></th>
          <th scope="col"></th>

        </tr>
      </thead>
      <tbody id="tableBody" class="tbody2">
        <tr
          *ngFor="let usuario of usuariosFiltrados.slice(calcularIndicesPagina().inicio, calcularIndicesPagina().fin); let i = index">
          <td class="custom-checkbox-cell">
            <input type="checkbox" class="custom-checkbox" [id]="'checkbox-' + i">
            <label [for]="'checkbox-' + i" class="custom-checkbox-label"></label>
          </td>
          <th>{{ usuario.cedula }}</th>
          <td>{{ usuario.nombre }}</td>
          <td>{{ usuario.correo }}</td>
          <td>{{ usuario.celular }}</td>
          <td class="acciones-cell acento-transparente">
            <div class="toggle-container" (click)="toggleEstadoUsuario(usuario)">
              <div class="toggle-switch" [ngClass]="{'activo': usuario.estado === 'inactivo'}"></div>
            </div>
          </td>  
          <td class="texto-negrilla">
            <a class="boton-modificar" href="#" data-value="opcion8" [routerLink]="['/usuario/update', usuario.cedula]">Modificar</a>
          </td>              
        </tr>
      </tbody>
    </table>

    <!-- Agregar la sección de paginación -->
    <div class="pagination">
      <button [disabled]="paginaActual === 1" (click)="cambiarPagina(paginaActual - 1)"
        class="pagination-button">Anterior</button>

      <button *ngIf="rangoPaginas[0] > 1" (click)="cambiarPagina(1)" class="pagination-button">1</button>

      <span *ngIf="rangoPaginas[0] > 2">...</span>

      <button *ngFor="let pagina of rangoPaginas" (click)="cambiarPagina(pagina)" class="pagination-button"
        [ngClass]="{'current-page': paginaActual === pagina}">
        {{ pagina }}
      </button>

      <span *ngIf="rangoPaginas[rangoPaginas.length - 1] < paginas.length - 1">...</span>

      <button *ngIf="rangoPaginas[rangoPaginas.length - 1] < paginas.length" (click)="cambiarPagina(paginas.length)"
        class="pagination-button">{{ paginas.length }}</button>

      <button [disabled]="paginaActual === paginas.length" (click)="cambiarPagina(paginaActual + 1)"
        class="pagination-button">Siguiente</button>
    </div>

    <div class="boton-crear">
      <a>
        <button [routerLink]="['/usuario/add']" class="acentro-amarillo-fondo texto-negrilla">Añadir</button>
      </a>
    </div>
  </section>
</div>
