<!-- modificar-mascota.component.html -->
<app-header [titleColor]="'acento-verde-oscuro-texto'" [backgroundColor]="'acento-transparente'"></app-header>
<section class="contenido-modificar-cliente">
  <section class="contenedor-img-modificar-entidad">
    <!-- Contenido relacionado con la imagen de la mascota en Angular -->
  </section>
  <section class="contenedor-img-modificar-mascota">
    <!-- Contenedor para la imagen del perro (puedes agregar lógica para mostrar la imagen aquí) -->
    <div class="contenedor-imagen-perro">
      <!-- Aquí puedes agregar la lógica para mostrar la imagen de la mascota -->
    </div>
    <!-- Contenedor para el label -->
    <div class="contenedor-label">
      <label for="nombre" class="acento-verde-texto enunciado">URL de Foto</label><br>
      <input *ngIf="mascota" [(ngModel)]="mascota.foto" name="foto" type="text" class="labelenunciado" id="nombre" placeholder="URL" required>
      <!-- Puedes agregar manejo de errores si es necesario -->
    </div>
  </section>
  <!-- Sección con los textos y campos -->
  <section class="contenedor-campos-modificar-entidad">
    <div class="seccion-input-contenido-dashboard">
      <h2 class="title-creacional subrayado acento-verde-oscuro-texto">Editar Datos de Mascota</h2>
      <form (ngSubmit)="actualizarMascota()" #form="ngForm">
        <div class="columna">
          <div class="uno" *ngIf="mascota">
            <label for="nombre" class="acento-verde-texto enunciado">Nombre</label><br>
            <input [(ngModel)]="mascota.nombre" name="nombre" type="text" class="labelenunciado" id="nombre" placeholder="Nombre" required>
            <!-- Puedes agregar manejo de errores si es necesario -->
          </div>
          <div class="dos" *ngIf="mascota">
            <label for="edad" class="acento-verde-texto enunciado">Edad</label><br>
            <input [(ngModel)]="mascota.edad" name="edad" type="number" class="labelenunciado" id="edad" placeholder="Edad" min="0" step="1" required>
            <!-- Puedes agregar manejo de errores si es necesario -->
          </div>
        </div>
        <div class="columna">
          <div class="uno" *ngIf="mascota">
            <label for="raza" class="acento-verde-texto enunciado">Raza</label><br>
            <input [(ngModel)]="mascota.raza" name="raza" type="text" class="labelenunciado" id="raza" placeholder="Raza" required>
            <!-- Puedes agregar manejo de errores si es necesario -->
          </div>
          <div class="dos" *ngIf="mascota">
            <label for="peso" class="acento-verde-texto enunciado">Peso</label><br>
            <input [(ngModel)]="mascota.peso" name="peso" type="number" class="labelenunciado" id="peso" placeholder="Peso" min="0.01" required>
            <!-- Puedes agregar manejo de errores si es necesario -->
          </div>
        </div>
        <div class="columna">
          <div class="uno" *ngIf="mascota">
            <label for="estado" class="acento-verde-texto enunciado">Estado</label><br>
            <select [(ngModel)]="mascota.estado" name="estado" class="lacento-verde-texto selectenunciado" id="estado" required>
              <option value="Sin estado">Sin estado</option>
              <option value="hospitalizado">Hospitalizado</option>
              <option value="curado">Curado</option>
            </select>
          </div>
          <div class="dos" *ngIf="mascota">
            <label for="enfermedad" class="acento-verde-texto enunciado">Enfermedad</label><br>
            <input [(ngModel)]="mascota.enfermedad" name="enfermedad" type="number" class="labelenunciado" id="enfermedad" placeholder="Enfermedad" required>
            <!-- Puedes agregar manejo de errores si es necesario -->
          </div>
        </div>
        <input *ngIf="mascota" type="hidden" [(ngModel)]="mascota.duenio.id" name="duenioId" />
        <!-- Más campos aquí... -->
        <button type="submit" class="buton">Actualizar Mascota</button>
      </form>
    </div>
  </section>
</section>
