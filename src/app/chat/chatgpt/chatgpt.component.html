<div class="chat-container">
  <a [routerLink]="''">
    <img class="waveimage2" src="./assets/bot/devolversebot.svg" alt="devolverse">
  </a>
  <div class="container mt-3">
    <div class="card">
      <div class="card-header naranja-principal-fondo text-light">
        <h1 class="recoleta-bold">PetPaws Chat</h1>
      </div>
      <div class="card-body">
        <div class="container">
          <div class="row">
            <div class="col-12 respuesta">
              <div class="chat-entry" *ngFor="let chat of chatHistory">
                <ul class="list-group chat-list">
                  <li class="list-group-item pregunta">
                    <strong>Pregunta:</strong> {{ chat.question }}
                  </li>
                  <li class="list-group-item respuesta">
                    <strong>Respuesta:</strong> {{ chat.answer }}
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <input [(ngModel)]="message" class="form-control" name="message" placeholder="Escribe tu mensaje aquí...">
        <button class="btn btn-outline-primary mt-2 mr-2 espacio-botones" (click)="sendMessage()">Enviar</button>
        <button class="btn btn-outline-danger mt-2 espacio-botones" (click)="limpiar()">Limpiar</button>
      </div>
    </div>
  </div>
</div>
