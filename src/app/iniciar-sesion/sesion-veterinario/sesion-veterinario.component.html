<div class="pagina-login-Layout">
    <!-- Seccion para los datos del usuario y los botones-->
    <section class="contenedor-texto-pagina-login">
      <div class="div-superior-texto-login">
        <h1 class="tituloCentrado acento-verde-claro-texto titulo-login">Iniciar sesión</h1>

        <form (ngSubmit)="login()" #loginForm="ngForm">
          <br>
          <input type="number" id="inputCedula" name="campoInputCedula" placeholder="Ingresa tu Cédula"
                 class="letra-poppins campo-input-login" [(ngModel)]="cedula">
          <br>
          <input type="password" id="inputPassword" name="campoInputPassword" placeholder="Ingresa tu Contraseña"
                 class="letra-poppins campo-password-login" [(ngModel)]="password">
          <br>
          <button type="submit" class="letra-poppins texto-negrilla boton-redondo boton-login-ingresar
          acento-verde-claro-fondo">Ingresar</button>
        </form>

        <div *ngIf="error" class="error">
          <p>{{ message }}</p>
        </div>

        <div *ngIf="inactive" class="error">
          <p>{{ message }}</p>
        </div>

        <div *ngIf="vacio" class="error">
          <p>Debe ingresar la cédula.</p>
        </div>

        <div class="espacio-blanco-texto-login"></div>

        <div class="div-inferior-texto-login letra-poppins">
          <a [routerLink]="['/usuario/login']">
            <button type="button" class="boton-redondo boton-login-otras-cuentas acento-amarillo-fondo texto-negrilla">
              Usuario
            </button>
          </a>
          <br>
          <a [routerLink]="['/administrador/login']">
            <button type="button" class="boton-redondo boton-login-otras-cuentas acento-naranja-claro-fondo texto-negrilla">
              Administrador
            </button>
          </a>
        </div>

        <p class="registro-mensaje">¿Aún no estás registrado? Únete!</p>
      </div>
    </section>
    <section class="contenedor-imagen-pagina-login" id="imagenLoginClientes">
    </section>
  </div>
