<div class="pagina-login-Layout">

<section class="contenedor-imagen-pagina-login" id="imagenLoginClientes">
    
  </section>
  
  <section class="contenedor-texto-pagina-login">
    <div class="div-superior-texto-login">
      <h1 class="tituloCentrado acento-rojo-claro-texto titulo-login">Iniciar sesión</h1>
  
      <form (ngSubmit)="login()" #loginForm="ngForm">
        <br>
        <input type="cedula" id="inputCedula" name="campoInputCedula" placeholder="Ingresa tu cédula" class="letra-poppins campo-input-login" [(ngModel)]="cedula">
        <br>
        <input type="password" id="inputPassword" name="campoInputPassword" placeholder="Ingresa tu contraseña" class="letra-poppins campo-password-login">
        <br>
        <button type="submit" class="letra-poppins texto-negrilla boton-redondo3 boton-login-ingresar acento-naranja-claro-fondo">Ingresar</button>
      </form>
  
      <div *ngIf="error" class="error">
        <p>Contraseña incorrecta.</p>
      </div>
  
      <div *ngIf="vacio" class="error">
        <p>Debe ingresar la cédula.</p>
      </div>
  
      <div class="espacio-blanco-texto-login"></div>
  
      <div class="div-inferior-texto-login letra-poppins">
        <a [routerLink]="['/usuario/login']"> 
            <button type="button" class="boton-redondo2 boton-login-otras-cuentas acento-amarillo-fondo texto-negrilla">
              Usuario
            </button>
          </a>
          
        <br>
        <a [routerLink]="['/veterinario/login']">
          <button type="button" class="boton-redondo2 boton-login-otras-cuentas acento-verde-claro-fondo texto-negrilla">
            Veterinarios
          </button>
        </a>
      </div>
      <p class="registro-mensaje">¿Aún no estás registrado? ¡Únete!</p>
    </div>
  </section>
</div>
