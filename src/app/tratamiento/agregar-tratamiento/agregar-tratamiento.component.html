<div class="completo">
    <app-header [titleColor]="'acento-rojo-texto'" [backgroundColor]="'acento-transparente'"></app-header>
    <div class="wave-container"></div>
    <img class="waveimage" src="./assets/creartratamiento/home.png" alt="perro">
    <img class="waveimage2" src="./assets/crearmascota/devolverse.svg" alt="devolverse">
    <section class="container-wave2 creacional">
        <h1 class="title-creacional subrayado">Añadir Tratamiento</h1>
        <form >
            <div class="columna">
                <div class="uno">
                    <label for="mascotaId" class="acento-verde-texto enunciado">Mascota</label>
                    <br>
                    <select id="mascotaId" formControlName="mascotaId" class="labelenunciado">
                        <option class="labelenunciado">Cedula, nombre</option>
                    </select>
                    <input type="hidden" id="duenioId" class="letra-poppins campo-input-dashboard form-control">
                </div>
                <div class="dos">
                    <label for="veterinarioId" class="acento-verde-texto enunciado">Veterinario</label>
                    <br>
                    <select id="veterinarioId" formControlName="veterinarioId" class="labelenunciado">
                        <option class="labelenunciado">Cedula, nombre</option>
                    </select>
                </div>
            </div>
            <div class="columna">
                <div class="uno">
                    <label for="medicamentoId" class="acento-verde-texto enunciado">Medicamento</label>
                    <br>
                    <select id="medicamentoId" formControlName="medicamentoId" class="labelenunciado">
                        <option class="labelenunciado">Medicamento</option>
                    </select>
                </div>
                <div class="dos">
                    <label for="foto" class="acento-verde-texto enunciado">Fecha</label>
                    <br>
                    <input type="date" formControlName="foto" class="lacento-verde-texto labelenunciado" id="foto"
                        placeholder="foto">
                </div>
            </div>
            <div class="columna">
                <div class="uno">
                    <label for="raza" class="acento-verde-texto enunciado">Descripción</label>
                    <br>
                    <input type="text" formControlName="raza" class="lacento-verde-texto labelenunciado" id="raza"
                        placeholder="Raza">
                </div>
            </div>
            <button type="submit"
                class="creacional2 no-bordes boton-redondo acento-rojo-fondo letra-poppins textoBlanco texto-negrilla">
                Guardar
            </button>
        </form>
    </section>
</div>
